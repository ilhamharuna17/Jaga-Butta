<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b3d2e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="JAGA BUTTA" />
  <meta name="description" content="Sistem Penanda Batas Tanah, Klasifikasi Lahan & Integrasi Google Earth - Kabupaten Jeneponto" />
  <title>JAGA BUTTA - Kab. Jeneponto</title>

  <!-- Favicon & Icon Layar Utama HP (Logo JAGA BUTTA) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%230D47A1'/%3E%3Ccircle cx='256' cy='230' r='145' fill='%23FFEB3B'/%3E%3Ccircle cx='256' cy='234' r='118' fill='%232E7D32'/%3E%3Ccircle cx='256' cy='250' r='82' fill='%23D50000'/%3E%3Crect x='250' y='150' width='12' height='175' fill='%23111111'/%3E%3Ctext x='256' y='445' text-anchor='middle' fill='%23FFFFFF' font-family='sans-serif' font-weight='900' font-size='54'%3EJAGA BUTTA%3C/text%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%230D47A1'/%3E%3Ccircle cx='256' cy='230' r='145' fill='%23FFEB3B'/%3E%3Ccircle cx='256' cy='234' r='118' fill='%232E7D32'/%3E%3Ccircle cx='256' cy='250' r='82' fill='%23D50000'/%3E%3Crect x='250' y='150' width='12' height='175' fill='%23111111'/%3E%3Ctext x='256' y='445' text-anchor='middle' fill='%23FFFFFF' font-family='sans-serif' font-weight='900' font-size='54'%3EJAGA BUTTA%3C/text%3E%3C/svg%3E" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #0b3d2e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #appFrame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: none;
      display: block;
      background: #f1f5f9;
    }

    #splashLoader {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #06281e 0%, #0b3d2e 55%, #0a2e5c 100%);
      color: #ffffff;
      text-align: center;
      padding: 24px;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }

    #splashLoader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: #fbbf24;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
      margin: 0 auto 16px auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .splash-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .splash-sub {
      font-size: 12px;
      color: #a7f3d0;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <!-- Splash Screen Saat Memuat Aplikasi -->
  <div id="splashLoader">
    <div>
      <div class="spinner"></div>
      <div class="splash-title">JAGA BUTTA</div>
      <div class="splash-sub">Kabupaten Jeneponto • Memuat Sistem...</div>
    </div>
  </div>

  <!-- Iframe Utama dengan Izin GPS Penuh untuk Pemetaan Lapangan -->
  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbyzKVu5tiA6g3Clfk8w64QWQY_uz1BmMMmj4N51RHLbnAzD3_dUXMoEW0BK4jMGCA/exec"
    title="JAGA BUTTA - Kab. Jeneponto"
    allow="geolocation *; clipboard-read *; clipboard-write *; fullscreen *"
    allowfullscreen
    loading="eager">
  </iframe>

  <script>
    const frame = document.getElementById("appFrame");
    const splash = document.getElementById("splashLoader");

    frame.addEventListener("load", () => {
      splash.classList.add("hidden");
    });

    // Otomatis menutup splash screen maksimal 3.5 detik
    setTimeout(() => {
      splash.classList.add("hidden");
    }, 3500);
  </script>
</body>
</html>
